# cava configuration for Omarchy Bandcamp Psychedelic Visualiser & Bar Meter.
# Taps the default audio output monitor at 60 FPS across 64 frequency bands.

[general]
mode = normal
framerate = 45
bars = 64
autosens = 1
sensitivity = 180
lower_cutoff_freq = 25
higher_cutoff_freq = 16500

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20
